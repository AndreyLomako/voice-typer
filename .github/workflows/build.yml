name: Сборка и релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Собрать только одну ОС (windows / macos / linux), пусто — все"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # ubuntu-22.04: старый glibc — бинарник запустится и на новых дистрибутивах
      matrix:
        include: >-
          ${{ fromJSON(
          inputs.only == 'windows' && '[{"name":"Windows","os":"windows-latest"}]' ||
          inputs.only == 'macos' && '[{"name":"macOS (Apple Silicon)","os":"macos-latest"}]' ||
          inputs.only == 'linux' && '[{"name":"Linux x86_64","os":"ubuntu-22.04"}]' ||
          '[{"name":"Windows","os":"windows-latest"},{"name":"macOS (Apple Silicon)","os":"macos-latest"},{"name":"Linux x86_64","os":"ubuntu-22.04"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_DISABLE_XET: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Системные пакеты (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xclip xvfb

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pip-audit

      - name: Проверка зависимостей на известные уязвимости
        run: pip-audit -r requirements.txt

      - name: Диагностика интерфейса (Linux)
        if: runner.os == 'Linux' && inputs.only == 'linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y gdb >/dev/null
          python make_icon.py
          echo "=== из исходников"; xvfb-run -a python -X faulthandler -m voicetyper --gui-smoke; echo "exit=$?"
          python build.py || true
          echo "=== собранный, gdb"
          xvfb-run -a gdb -batch -ex "set follow-fork-mode child" -ex "set detach-on-fork off" -ex run -ex "thread apply all bt 25" --args dist/VoiceTyper-hs --gui-smoke 2>&1 | grep -vE "^\[(New|Thread|Detaching|Inferior)" | tail -120

      - name: Сборка и проверка распознавания
        run: python build.py --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-hs-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Контрольные суммы
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Загрузка файлов в релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "VoiceTyper hs ${TAG#v}" --notes "Сборки для Windows, macOS и Linux."
          gh release upload "$TAG" release/* -R "$GITHUB_REPOSITORY" --clobber
